{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CAMISA 12</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>


<body>

<header>

    <h1>CAMISA 12</h1>

</header>


<div class="container">

    <h2>Entrar</h2>


    {% for message in messages %}

        <div class="mensagem">
            {{ message }}
        </div>

    {% endfor %}


    <form method="POST">

        {% csrf_token %}


        <label for="username">
            Nome de usuário
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >


        <label for="password">
            Senha
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >


        <button type="submit">
            Entrar
        </button>

    </form>


    <div class="cadastro">

        Ainda não possui uma conta?

        <a href="{% url 'Camisa12:cadastro' %}">
            Criar conta
        </a>

    </div>

</div>

</body>

</html>
